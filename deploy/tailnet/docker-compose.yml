# Sleep Bandit beside the executive-assistant agent on the same server. Reached two ways: by the agent on the
# shared Docker network (http://bandit:8777), and by Eli's own devices over Tailscale (`tailscale serve` hands the
# tailnet's port 8777 to 127.0.0.1:8777). Never published on a public address: Docker bypasses ufw.
services:
  bandit:
    build: .
    image: sleep-bandit
    container_name: bandit
    restart: unless-stopped
    init: true
    environment:
      SB_HOST: 0.0.0.0
      SB_PORT: "8777"
      SB_AUTOSYNC: "1"                       # nobody opens the page on the server, so it plans and syncs Oura by itself
      SB_SHARED_DIR: /app/shared
      TZ: ${SB_TZ:-America/Los_Angeles}
      # The public face, off unless `server.sh public-on` filled these in (/opt/sleep-bandit/env). SB_PRIVATE_DIRECT:
      # only what comes through Caddy is treated as public; the tailnet and the agent keep the full app.
      SB_PUBLIC: ${SB_PUBLIC:-}
      SB_PRIVATE_DIRECT: "1"
      SB_BASE_URL: ${SB_BASE_URL:-}
      SB_ADMIN_PATH: ${SB_ADMIN_PATH:-admin}
      SB_PASSWORD_HASH: ${SB_PASSWORD_HASH:-}
      HOME: /home/bandit                     # ~/Library/Application Support/LLMInbox, shared with the agent (below)
    volumes:
      - ${SB_ROOT:-/opt/sleep-bandit}/app:/app:ro
      - ${SB_ROOT:-/opt/sleep-bandit}/data:/app/data
      - ${SB_ROOT:-/opt/sleep-bandit}/backups:/app/backups
      # Only the LLM inbox is shared with the agent: a message from the tagging model to Eli lands in the same
      # file the agent relays to the Mac. Nothing else of the agent's is visible here.
      - ${ATLAS_INBOX:-/opt/atlas/data/home/Library/Application Support/LLMInbox}:/home/bandit/Library/Application Support/LLMInbox
    ports:
      - "127.0.0.1:8777:8777"
    networks: [atlas]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  # Only started by `server.sh public-on` (compose profile "public"): the one thing on this machine that listens
  # on the public internet besides ssh.
  caddy:
    image: caddy:2
    container_name: bandit-caddy
    profiles: [public]
    restart: unless-stopped
    environment:
      SB_DOMAIN: ${SB_DOMAIN:-elissleepbandit.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SB_ROOT:-/opt/sleep-bandit}/caddy:/data
    ports:
      - "80:80"
      - "443:443"
    networks: [atlas]
networks:
  atlas:
    name: ${ATLAS_NETWORK:-deploy_default}
    external: true
